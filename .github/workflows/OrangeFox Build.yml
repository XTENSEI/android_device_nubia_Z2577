name: OrangeFox Build

on:
  workflow_dispatch:
    inputs:
      DEVICE_TREE_URL:
        description: Device Tree URL
        required: true
        default: https://github.com/XTENSEI/android_device_nubia_Z2577
      DEVICE_TREE_BRANCH:
        description: Device Tree Branch
        required: true
        default: fox_14.1
      DEVICE_PATH:
        description: Path the device tree should be synced to, relative to source root
        required: true
        default: device/nubia/Z2577
      DEVICE_NAME:
        description: Device Name from tree (should match name on twrp_<DEVICE_NAME>.mk)
        required: true
        default: Z2577
      BUILD_TARGET:
        description: Partition containing recovery ramdisk
        type: choice
        options:
        - boot
        - recovery
        - vendor_boot
        required: true
        default: vendor_boot
jobs:
  build:
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-22.04
    steps:
    - name: Display Run Parameters
      run: |
        echo "::group::User Environment Variables"
        echo "Device Tree URL: ${{ inputs.DEVICE_TREE_URL }}"
        echo "Device Tree Branch: ${{ inputs.DEVICE_TREE_BRANCH }}"
        echo "Device Path: ${{ inputs.DEVICE_PATH }}"
        echo "Device Name: ${{ inputs.DEVICE_NAME }}"
        echo "Build Target: ${{ inputs.BUILD_TARGET }}.img"
        echo "::endgroup::"

    - name: Check Out
      uses: actions/checkout@v4

    - name: Cleanup
      uses: rokibhasansagar/slimhub_actions@main

    - name: Set Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 16

    - name: Prepare the environment
      run: |
        sudo apt -y install gperf gcc-multilib gcc-10-multilib g++-multilib g++-10-multilib libc6-dev lib32ncurses5-dev x11proto-core-dev libx11-dev tree lib32z-dev libgl1-mesa-dev libxml2-utils xsltproc bc ccache lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libwxgtk3.0-gtk3-dev libxml2 lzop pngcrush schedtool squashfs-tools imagemagick libbz2-dev lzma ncftp qemu-user-static libstdc++-10-dev libtinfo5
        sudo add-apt-repository universe
        sudo apt -y install libncurses5

    - name: Install repo
      run: |
        mkdir ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    - name: Set up OrangeFox fox_14.1 sources
      run: |
        git config --global user.name "${GITHUB_ACTOR}"
        git config --global user.email "${GITHUB_ACTOR_ID}+${GITHUB_ACTOR}@users.noreply.github.com"
        git clone https://gitlab.com/OrangeFox/sync /tmp/ofox-sync
        cd /tmp/ofox-sync
        ./orangefox_sync.sh -b 14.1 -p ${GITHUB_WORKSPACE}/workspace

    - name: Clone device tree
      run: |
        cd workspace
        git clone -b ${{ inputs.DEVICE_TREE_BRANCH }} ${{ inputs.DEVICE_TREE_URL }} ${{ inputs.DEVICE_PATH }}

    - name: Apply device patches
      run: |
        cd workspace/${{ inputs.DEVICE_PATH }}/patches
        find . -type f -print0 | xargs -0 cp -f --parents -t $GITHUB_WORKSPACE/workspace
        cd $GITHUB_WORKSPACE/workspace
        grep -q 'drmModePageFlip' bootable/recovery/minuitwrp/graphics_drm.cpp
        grep -q 'getService("default", false)' hardware/interfaces/boot/aidl/client/BootControlClient.cpp
        grep -q 'retry || tries == 0' system/libhidl/transport/ServiceManagement.cpp

    - name: Fix CTS release version check
      run: |
        cd workspace
        grep -q '^16\.1\.0$' cts/tests/tests/os/assets/platform_releases.txt || echo '16.1.0' >> cts/tests/tests/os/assets/platform_releases.txt

    - name: Building OrangeFox
      run: |
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        export FOX_BUILD_DEVICE=${{ inputs.DEVICE_NAME }}
        lunch twrp_${{ inputs.DEVICE_NAME }}-ap2a-eng
        export JOBS=2
        mka adbd $(tr -d _ <<< ${{ inputs.BUILD_TARGET }})image -j2
      working-directory: workspace

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ofox-${{ inputs.BUILD_TARGET }}
        path: |
          workspace/out/target/product/${{ inputs.DEVICE_NAME }}/${{ inputs.BUILD_TARGET }}.img
          workspace/out/target/product/${{ inputs.DEVICE_NAME }}/OrangeFox*.img
          workspace/out/target/product/${{ inputs.DEVICE_NAME }}/obj/PACKAGING/vendor_ramdisk_fragments_intermediates/recovery.*
        if-no-files-found: warn

    - name: Upload to Release
      uses: softprops/action-gh-release@4634c16e79c963813287e889244c50009e7f0981
      with:
        files: |
          workspace/out/target/product/${{ inputs.DEVICE_NAME }}/${{ inputs.BUILD_TARGET }}.img
          workspace/out/target/product/${{ inputs.DEVICE_NAME }}/OrangeFox*.img
          workspace/out/target/product/${{ inputs.DEVICE_NAME }}/obj/PACKAGING/vendor_ramdisk_fragments_intermediates/recovery.*
        name: ${{ inputs.DEVICE_NAME }} (OrangeFox)
        tag_name: ${{ github.run_id }}
        body: |
          Manifest: fox_14.1
          Target: ${{ inputs.BUILD_TARGET }}.img
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify:
    name: Telegram Summary
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Get run metadata
        id: meta
        run: |
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          START=$(date -d "${{ github.event.workflow_run.created_at || github.event.repository.updated_at }}" +%s 2>/dev/null || echo 0)
          NOW=$(date +%s)
          ELAPSED=$(( NOW - START ))
          MINS=$(( ELAPSED / 60 ))
          SECS=$(( ELAPSED % 60 ))
          DURATION="${MINS}m ${SECS}s"

          CONCLUSION="${{ needs.build.result }}"
          if [ "$CONCLUSION" = "success" ]; then
            STATUS="✅ Passed"
          elif [ "$CONCLUSION" = "failure" ]; then
            STATUS="❌ Failed"
          elif [ "$CONCLUSION" = "cancelled" ]; then
            STATUS="⚠️ Cancelled"
          else
            STATUS="⚠️ $CONCLUSION"
          fi

          echo "duration=$DURATION" >> "$GITHUB_OUTPUT"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "run_url=$RUN_URL" >> "$GITHUB_OUTPUT"

      - name: Get device tree commit
        id: dtree_commit
        run: |
          REPO_URL="${{ inputs.DEVICE_TREE_URL }}"
          BRANCH="${{ inputs.DEVICE_TREE_BRANCH }}"
          # Extract owner/repo from URL
          REPO_PATH=$(echo "$REPO_URL" | sed 's|https://github.com/||' | sed 's|\.git$||')
          CLONE_URL="https://github.com/${REPO_PATH}"
          SHA=$(git ls-remote "$CLONE_URL" "refs/heads/$BRANCH" | head -1 | cut -f1)
          SHORT_SHA=$(echo "$SHA" | cut -c1-7)
          COMMIT_URL="https://github.com/${REPO_PATH}/commit/${SHA}"
          COMMIT_MSG=$(curl -s "https://api.github.com/repos/${REPO_PATH}/commits/${SHA}" | python3 -c "import sys,json; c=json.load(sys.stdin); print(c.get('commit',{}).get('message','').split(chr(10))[0][:80])" 2>/dev/null || echo "")
          echo "sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "url=$COMMIT_URL" >> "$GITHUB_OUTPUT"
          echo "msg=$COMMIT_MSG" >> "$GITHUB_OUTPUT"

      - name: Collect artifacts with sizes
        id: artifacts
        run: |
          ARTIFACTS=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
            --jq '.artifacts[] | "\(.name) (\(.size_in_bytes / 1048576 * 100 | floor / 100) MB)"' 2>/dev/null || echo "")
          if [ -z "$ARTIFACTS" ]; then
            ARTIFACTS="(no artifacts)"
          fi
          echo "list<<EOF" >> "$GITHUB_OUTPUT"
          echo "$ARTIFACTS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Send Telegram notification
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MSG="🪡 OrangeFox Build Complete
#Z2577

📱 Device: ${{ inputs.DEVICE_NAME }} (Nubia V80 Max)
🌿 Branch: ${{ inputs.DEVICE_TREE_BRANCH }}
📝 Commit: ${{ steps.dtree_commit.outputs.sha }} - ${{ steps.dtree_commit.outputs.msg }}
🔗 ${{ steps.dtree_commit.outputs.url }}
🎯 Target: ${{ inputs.BUILD_TARGET }}.img
⏱ Duration: ${{ steps.meta.outputs.duration }}
📊 Status: ${{ steps.meta.outputs.status }}

📦 Artifacts:
${{ steps.artifacts.outputs.list }}

🔗 Summary: ${{ steps.meta.outputs.run_url }}"

          ESCAPED=$(echo "$MSG" | python3 -c "import sys,json; print(json.dumps(sys.stdin.read()))")

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\": \"${TELEGRAM_CHAT}\", \"text\": ${ESCAPED}, \"parse_mode\": \"\"}"
