name: AERA Build

permissions: write-all

on:
  workflow_dispatch:
    inputs:
      DEVICE_TREE_URL:
        description: Device Tree URL
        required: true
        default: https://github.com/XTENSEI/android_device_nubia_Z2577
      DEVICE_TREE_BRANCH:
        description: Device Tree Branch
        required: true
        default: aera-16
      DEVICE_PATH:
        description: Path the device tree should be synced to, relative to source root
        required: true
        default: device/nubia/Z2577
      DEVICE_NAME:
        description: Device Name from tree (should match name on twrp_DEVICE_NAME.mk)
        required: true
        default: Z2577
      AERA_BRANCH:
        description: AERA manifest branch
        required: true
        default: aera-16.0
      MINIMAL:
        description: Apply AERA's remove-minimal.xml (drops ~600 unneeded projects)
        type: choice
        options:
        - "true"
        - "false"
        required: true
        default: "true"
      RUNNER:
        description: Runner label. A full AOSP 16 sync does not fit a stock GitHub runner
        required: true
        default: ubuntu-22.04
jobs:
  build:
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ${{ inputs.RUNNER }}
    steps:
    - name: Display Run Parameters
      run: |
        echo "::group::User Environment Variables"
        echo "Device Tree URL: ${{ inputs.DEVICE_TREE_URL }}"
        echo "Device Tree Branch: ${{ inputs.DEVICE_TREE_BRANCH }}"
        echo "Device Path: ${{ inputs.DEVICE_PATH }}"
        echo "Device Name: ${{ inputs.DEVICE_NAME }}"
        echo "Manifest: ${{ inputs.AERA_BRANCH }}"
        echo "Minimal manifest: ${{ inputs.MINIMAL }}"
        echo "Build Target: vendor_boot.img"
        echo "::endgroup::"
        df -h /

    - name: Notify build started
      env:
        TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        DEV: ${{ inputs.DEVICE_NAME }}
        BRANCH: ${{ inputs.DEVICE_TREE_BRANCH }}
        MANIFEST: ${{ inputs.AERA_BRANCH }}
        URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        MSG=$(printf '%s\n' \
          "⚙️ Build Started" \
          "📋 Workflow: AERA Build" \
          "📱 Device: ${DEV}" \
          "🌿 Branch: ${BRANCH}" \
          "📦 Manifest: ${MANIFEST}" \
          "🔍 Watch on GitHub Actions (${URL})")
        ESCAPED=$(echo "$MSG" | python3 -c "import sys,json; print(json.dumps(sys.stdin.read()))")
        curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
          -H "Content-Type: application/json" \
          -d "{\"chat_id\": \"${TG_CHAT}\", \"text\": ${ESCAPED}}" || true

    - name: Check Out
      uses: actions/checkout@v4

    - name: Cleanup
      uses: rokibhasansagar/slimhub_actions@main

    - name: Set Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 16

    - name: Prepare the environment
      run: |
        sudo apt -y install gperf g++-multilib libc6-dev lib32ncurses5-dev x11proto-core-dev \
          libx11-dev tree lib32z-dev libgl1-mesa-dev libxml2-utils xsltproc bc ccache zip \
          lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev \
          libxml2 lzop pngcrush schedtool squashfs-tools imagemagick libbz2-dev lzma \
          ncftp qemu-user-static libstdc++-10-dev python3

    - name: Install repo
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    - name: Set up AERA sources
      run: |
        git config --global user.name "${GITHUB_ACTOR}"
        git config --global user.email "${GITHUB_ACTOR_ID}+${GITHUB_ACTOR}@users.noreply.github.com"
        mkdir -p ${GITHUB_WORKSPACE}/workspace
        cd ${GITHUB_WORKSPACE}/workspace
        repo init -u https://github.com/AERA-Recovery/android_manifest.git \
          -b ${{ inputs.AERA_BRANCH }}
        if [ "${{ inputs.MINIMAL }}" = "true" ]; then
          mkdir -p .repo/local_manifests
          curl -fsSL -o .repo/local_manifests/remove-minimal.xml \
            https://raw.githubusercontent.com/AERA-Recovery/android_manifest/${{ inputs.AERA_BRANCH }}/remove-minimal.xml
        fi
        repo sync -c --force-sync --no-clone-bundle --no-tags -j2
        df -h /

    - name: Clone device tree
      run: |
        cd workspace
        git clone -b ${{ inputs.DEVICE_TREE_BRANCH }} ${{ inputs.DEVICE_TREE_URL }} ${{ inputs.DEVICE_PATH }}

    - name: Apply device patches
      run: |
        # Only the two HIDL patches are overlays. data.cpp and
        # minuitwrp/graphics_drm.cpp are full-file copies taken from OrangeFox
        # and would replace AERA's own versions, so they are not applied here.
        cd workspace/${{ inputs.DEVICE_PATH }}/patches
        find hardware system -type f -print0 | xargs -0 cp -f --parents -t $GITHUB_WORKSPACE/workspace
        cd $GITHUB_WORKSPACE/workspace
        grep -q 'getService("default", false)' hardware/interfaces/boot/aidl/client/BootControlClient.cpp
        grep -q 'retry || tries == 0' system/libhidl/transport/ServiceManagement.cpp
        echo "skipped on purpose: bootable/recovery/data.cpp, bootable/recovery/minuitwrp/graphics_drm.cpp"

    - name: Build AERA
      run: |
        export AERA_BUILD_DEVICE=${{ inputs.DEVICE_NAME }}
        source build/envsetup.sh
        lunch twrp_${{ inputs.DEVICE_NAME }}-bp2a-eng
        mka adbd vendorbootimage -j2
      working-directory: workspace

    - name: Report image size
      run: |
        OUT=workspace/out/target/product/${{ inputs.DEVICE_NAME }}
        IMG=$OUT/vendor_boot.img
        [ -f "$IMG" ] || { echo "::error::vendor_boot.img was not produced"; exit 1; }
        SZ=$(stat -c%s "$IMG")
        PART=104857600
        echo "vendor_boot.img : $SZ bytes"
        echo "partition       : $PART bytes"
        echo "headroom        : $((PART - SZ)) bytes"
        for f in $OUT/obj/PACKAGING/vendor_ramdisk_fragments_intermediates/recovery.*; do
          [ -f "$f" ] && echo "$(basename "$f") : $(stat -c%s "$f") bytes"
        done
        if [ "$SZ" -gt "$PART" ]; then
          echo "::error::vendor_boot.img is $((SZ - PART)) bytes over the partition"
          exit 1
        fi

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: aera-${{ inputs.DEVICE_NAME }}
        path: |
          workspace/out/target/product/${{ inputs.DEVICE_NAME }}/vendor_boot.img
          workspace/out/target/product/${{ inputs.DEVICE_NAME }}/AERA-R*.zip
          workspace/out/target/product/${{ inputs.DEVICE_NAME }}/AERA-R*.img
          workspace/out/target/product/${{ inputs.DEVICE_NAME }}/obj/PACKAGING/vendor_ramdisk_fragments_intermediates/recovery.*
        if-no-files-found: warn

    - name: Upload to Release
      uses: softprops/action-gh-release@4634c16e79c963813287e889244c50009e7f0981
      with:
        files: |
          workspace/out/target/product/${{ inputs.DEVICE_NAME }}/vendor_boot.img
          workspace/out/target/product/${{ inputs.DEVICE_NAME }}/AERA-R*.zip
          workspace/out/target/product/${{ inputs.DEVICE_NAME }}/AERA-R*.img
        name: ${{ inputs.DEVICE_NAME }} (AERA)
        tag_name: ${{ github.run_id }}
        body: |
          Manifest: ${{ inputs.AERA_BRANCH }}
          Target: vendor_boot.img
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify:
    name: Telegram Summary
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Get run metadata
        id: meta
        run: |
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          CONCLUSION="${{ needs.build.result }}"
          if [ "$CONCLUSION" = "success" ]; then
            STATUS="Passed"
          elif [ "$CONCLUSION" = "failure" ]; then
            STATUS="Failed"
          elif [ "$CONCLUSION" = "cancelled" ]; then
            STATUS="Cancelled"
          else
            STATUS="$CONCLUSION"
          fi
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "run_url=$RUN_URL" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
          echo "release_url=https://github.com/${{ github.repository }}/releases/tag/${{ github.run_id }}" >> "$GITHUB_OUTPUT"

      - name: Get device tree commit
        id: dtree_commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO_PATH=$(echo "${{ inputs.DEVICE_TREE_URL }}" | sed 's|https://github.com/||' | sed 's|\.git$||')
          SHA=$(git ls-remote "https://github.com/${REPO_PATH}" "refs/heads/${{ inputs.DEVICE_TREE_BRANCH }}" | head -1 | cut -f1)
          SHORT_SHA=$(echo "$SHA" | cut -c1-7)
          COMMIT_URL="https://github.com/${REPO_PATH}/commit/${SHA}"
          COMMIT_MSG=$(gh api "repos/${REPO_PATH}/commits/${SHA}" --jq '.commit.message | split("\n")[0][:80]' 2>/dev/null || echo "")
          echo "sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "url=$COMMIT_URL" >> "$GITHUB_OUTPUT"
          echo "msg=$COMMIT_MSG" >> "$GITHUB_OUTPUT"

      - name: Collect artifacts
        id: artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARTIFACTS=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --jq '.artifacts[] | "\(.name) (\(.size_in_bytes / 1048576 * 100 | floor / 100) MB)"' 2>/dev/null || echo "")
          echo "list=$ARTIFACTS" >> "$GITHUB_OUTPUT"

      - name: Send Telegram notification
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          DEV: ${{ inputs.DEVICE_NAME }}
          BRANCH: ${{ inputs.DEVICE_TREE_BRANCH }}
          MANIFEST: ${{ inputs.AERA_BRANCH }}
          DSHA: ${{ steps.dtree_commit.outputs.sha }}
          STATUS: ${{ steps.meta.outputs.status }}
          DATE: ${{ steps.meta.outputs.date }}
          REL: ${{ steps.meta.outputs.release_url }}
          URL: ${{ steps.meta.outputs.run_url }}
        run: |
          if [ "${STATUS}" = "Passed" ]; then
            HEAD="🚀 Unofficial AERA Recovery Build Released"
          else
            HEAD="⚠️ Build ${STATUS}"
          fi
          MSG=$(printf '%s\n' \
            "${HEAD}" \
            "📋 Workflow: AERA Build" \
            "📱 Device: ${DEV}" \
            "🌿 Branch: ${BRANCH}" \
            "📦 Manifest: ${MANIFEST}" \
            "📅 Build Date: ${DATE}" \
            "📝 Commit: ${DSHA}" \
            "🔗 View Release on GitHub (${REL})" \
            "🪵 Full Workflow Log (${URL})")
          ESCAPED=$(echo "$MSG" | python3 -c "import sys,json; print(json.dumps(sys.stdin.read()))")
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\": \"${TG_CHAT}\", \"text\": ${ESCAPED}}"
